<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CYBER PULSE: TIMING MACHINE</title>
    
    <!-- Tailwind CSS e Fontes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Aqui conecta com o seu arquivo style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen text-slate-100 relative p-3 sm:p-4">

    <canvas id="bgCanvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none"></canvas>
    <canvas id="fxCanvas" class="fixed inset-0 w-full h-full z-20 pointer-events-none"></canvas>
    <div id="floatingTextContainer" class="fixed inset-0 z-30 pointer-events-none flex items-center justify-center"></div>

    <main id="gameContainer" class="relative z-10 w-full max-w-xl mx-auto p-5 sm:p-8 rounded-2xl glass-panel box-glow-cyan flex flex-col items-center justify-between gap-5 shadow-2xl">
        <header class="text-center w-full relative">
            <div class="inline-block px-3 py-1 text-[10px] sm:text-xs font-bold tracking-widest text-cyan-400 bg-cyan-950/70 border border-cyan-500/40 rounded-full mb-2 uppercase font-orbitron">
                Modo Precisão Arcade
            </div>
            <h1 class="text-3xl sm:text-5xl font-black font-orbitron tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-purple-500 glow-cyan">
                CYBER PULSE
            </h1>
            <p class="text-[11px] sm:text-xs text-slate-400 tracking-widest uppercase font-semibold mt-1">
                PARE O PONTEIRO NO NÚMERO ALVO SOLICITADO
            </p>
        </header>

        <div class="w-full bg-gradient-to-r from-emerald-950/60 via-slate-900/90 to-emerald-950/60 border border-emerald-500/40 rounded-xl p-3 flex justify-between items-center box-glow-cyan">
            <div class="text-left">
                <span class="block text-[10px] text-emerald-400 font-bold uppercase tracking-wider font-orbitron">NÚMERO ALVO</span>
                <span id="targetNumberDisplay" class="text-3xl sm:text-4xl font-black font-orbitron text-emerald-300 glow-emerald">30</span>
            </div>
            <div class="text-right">
                <span class="block text-[10px] text-cyan-400 font-bold uppercase tracking-wider font-orbitron">VALOR ATUAL</span>
                <span id="currentValueDisplay" class="text-3xl sm:text-4xl font-black font-orbitron text-cyan-300 glow-cyan">0</span>
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2 sm:gap-3 w-full">
            <div class="glass-panel p-2 sm:p-2.5 rounded-xl text-center border-slate-700/50">
                <span class="block text-[9px] sm:text-xs text-slate-400 uppercase font-bold tracking-wider">SCORE</span>
                <span id="scoreText" class="text-lg sm:text-2xl font-black font-orbitron text-cyan-400 glow-cyan">0</span>
            </div>
            <div class="glass-panel p-2 sm:p-2.5 rounded-xl text-center border-slate-700/50">
                <span class="block text-[9px] sm:text-xs text-slate-400 uppercase font-bold tracking-wider">RECORDE</span>
                <span id="highScoreText" class="text-lg sm:text-2xl font-black font-orbitron text-purple-400">0</span>
            </div>
            <div class="glass-panel p-2 sm:p-2.5 rounded-xl text-center border-slate-700/50">
                <span class="block text-[9px] sm:text-xs text-slate-400 uppercase font-bold tracking-wider">COMBO</span>
                <span id="comboText" class="text-lg sm:text-2xl font-black font-orbitron text-amber-400 glow-amber">x1</span>
            </div>
            <div class="glass-panel p-2 sm:p-2.5 rounded-xl text-center border-slate-700/50">
                <span class="block text-[9px] sm:text-xs text-slate-400 uppercase font-bold tracking-wider">ACERTOS</span>
                <span id="accuracyText" class="text-lg sm:text-2xl font-black font-orbitron text-pink-400">0%</span>
            </div>
        </div>

        <div class="w-full my-1">
            <div class="flex justify-between text-xs font-bold text-slate-400 mb-2 px-1 font-orbitron">
                <span class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
                    ESCALA (0 - 60)
                </span>
                <span id="speedIndicator" class="text-cyan-400">VELOCIDADE: 1.0x</span>
            </div>

            <div id="barWrapper" class="relative w-full h-16 sm:h-20 bg-slate-950/90 rounded-xl border-2 border-cyan-500/40 overflow-hidden box-glow-cyan cursor-pointer touch-none">
                <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b_1px,transparent_1px)] bg-[size:10px_100%] opacity-30 pointer-events-none"></div>

                <div class="absolute inset-0 flex justify-between px-2 items-end pb-1 text-[10px] font-mono text-slate-500 pointer-events-none select-none">
                    <span style="left: 0%" class="absolute bottom-1 translate-x-1">0</span>
                    <span style="left: 16.66%" class="absolute bottom-1 -translate-x-1/2">10</span>
                    <span style="left: 33.33%" class="absolute bottom-1 -translate-x-1/2">20</span>
                    <span style="left: 50%" class="absolute bottom-1 -translate-x-1/2">30</span>
                    <span style="left: 66.66%" class="absolute bottom-1 -translate-x-1/2">40</span>
                    <span style="left: 83.33%" class="absolute bottom-1 -translate-x-1/2">50</span>
                    <span style="right: 0%" class="absolute bottom-1 -translate-x-1">60</span>
                </div>

                <div id="targetZone" class="absolute top-0 bottom-0 bg-gradient-to-r from-emerald-500/40 via-emerald-400/60 to-emerald-500/40 border-x-2 border-emerald-400 target-pulse flex flex-col items-center justify-center pointer-events-none">
                    <span id="targetZoneNum" class="text-xs sm:text-sm font-black font-orbitron text-emerald-300 glow-emerald">30</span>
                    <span class="text-[9px] font-bold font-orbitron text-emerald-200 opacity-80 uppercase select-none">ALVO</span>
                </div>

                <div id="laserPointer" class="absolute top-0 bottom-0 w-2 bg-pink-400 shadow-[0_0_15px_#ec4899,0_0_30px_#ec4899] -translate-x-1/2 z-10 pointer-events-none">
                    <div class="w-full h-full bg-white opacity-90"></div>
                    <div id="pointerTooltip" class="absolute -top-7 left-1/2 -translate-x-1/2 bg-pink-500 text-slate-950 font-black font-orbitron text-[10px] px-1.5 py-0.5 rounded shadow">0</div>
                </div>
            </div>
        </div>

        <div class="w-full flex flex-col gap-3">
            <button id="actionBtn" class="cyber-btn w-full py-4 sm:py-5 rounded-xl font-orbitron font-black text-lg sm:text-2xl text-slate-950 tracking-wider uppercase shadow-lg select-none cursor-pointer">
                TRAVAR PULSO [ESPAÇO]
            </button>
            <div class="flex gap-3">
                <button id="soundToggleBtn" class="w-1/2 py-2.5 glass-panel hover:bg-cyan-950/40 border-cyan-500/30 rounded-lg text-xs font-bold font-orbitron text-cyan-400 tracking-wider flex items-center justify-center gap-2 transition cursor-pointer">
                    🔊 ÁUDIO: LIGADO
                </button>
                <button id="resetStatsBtn" class="w-1/2 py-2.5 glass-panel hover:bg-pink-950/40 border-pink-500/30 rounded-lg text-xs font-bold font-orbitron text-pink-400 tracking-wider transition cursor-pointer">
                    RESETAR STATS
                </button>
            </div>
        </div>

        <div id="statusBanner" class="w-full py-2.5 px-4 rounded-xl text-center font-orbitron font-bold text-xs sm:text-sm tracking-wide bg-slate-900/80 border border-slate-800 text-slate-300">
            PRESSIONE <span class="text-cyan-400">ESPAÇO</span> OU <span class="text-cyan-400">TOQUE NO BOTÃO</span> PARA TRAVAR
        </div>
    </main>

    <!-- Aqui conecta com o seu arquivo script.js -->
    <script src="script.js"></script>
</body>
</html>
